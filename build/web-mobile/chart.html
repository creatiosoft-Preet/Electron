<!DOCTYPE html>
<html>

<head>
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Real-Time Portfolio Chart</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
		}

		body {
			background: #2a2a2a;
			font-family: Arial, sans-serif;
		}

		#chart-container {
			width: 100vw !important;
			height: 100vh !important;
			position: absolute;
			inset: 0;
			margin: 0;
			padding: 0;
			background: #2a2a2a;
			touch-action: none;
			-webkit-user-select: none;
			user-select: none;
		}

		#chart-container canvas {
			margin-left: -10px !important;
			/* 负 margin 消除左侧小间隙，值可调 -5 ~ -15 */
		}
	</style>
	<script src="./lightweight-charts.standalone.production.js"></script>
</head>

<body>
	<div id="chart-container"></div>

	<script>
		let chart = null;
		let areaSeries = null;
		let dataPoints = [];
		let dataIndex = 0;
		let startTimestamp = null;
		let currentTrend = "Up";

		const colorSchemes = {
			Up: {
				lineColor: 'rgba(76, 175, 80, 1)',
				topColor: 'rgba(76, 175, 80, 0.68)',
				bottomColor: 'rgba(56, 142, 60, 0.08)',
				priceLineColor: 'rgba(76, 175, 80, 0.7)'
			},
			Down: {
				lineColor: 'rgba(226, 74, 74, 1)',
				topColor: 'rgba(211, 42, 42, 0.68)',
				bottomColor: 'rgba(179, 37, 37, 0.08)',
				priceLineColor: 'rgba(255, 41, 41, 0.7)'
			}
		};

		function formatDisplayTime(timestamp) {
			const date = new Date(timestamp);
			const hours = date.getHours().toString().padStart(2, '0');
			const minutes = date.getMinutes().toString().padStart(2, '0');
			const seconds = date.getSeconds().toString().padStart(2, '0');
			return `${hours}:${minutes}:${seconds}`;
		}

		function formatValue(value) {
			if (value >= 1000000) return (value / 1000000).toFixed(2) + 'M';
			if (value >= 1000) return (value / 1000).toFixed(2) + 'K';
			return value.toFixed(2);
		}

		window.initChartWithSize = function (width, height) {
			// console.log('Init called with:', width, 'x', height);

			const container = document.getElementById('chart-container');
			if (!container) {
				// console.error('Chart container not found');
				return;
			}

			container.style.width = width + 'px';
			container.style.height = height + 'px';

			if (chart) {
				container.innerHTML = '';
			}

			try {
				chart = LightweightCharts.createChart(container, {
					width: width,
					height: height,
					layout: {
						background: { color: '#2a2a2a' },
						textColor: '#ffffff',
						fontSize: 10
					},
					grid: {
						vertLines: { color: '#353547', style: 1 },
						horzLines: { color: '#353547', style: 1 }
					},
					timeScale: {
						timeVisible: true,
						secondsVisible: false,
						rightOffset: 0,
						barSpacing: 6,
						borderVisible: true,
						tickMarkMaxCharacterLength: 8,
						tickMarkFormatter: (time) => {
							const index = parseInt(time);
							if (startTimestamp && dataPoints[index]) {
								return formatDisplayTime(dataPoints[index].originalTime);
							}
							return '';
						}
					},
					handleScroll: {
						mouseWheel: true,
						pressedMouseMove: true,
						horzTouchDrag: true
					},
					handleScale: {
						axisPressedMouseMove: true,
						mouseWheel: true,
						pinch: true
					}
				});

				const colors = colorSchemes[currentTrend];
				areaSeries = chart.addAreaSeries({
					lineColor: colors.lineColor,
					lineWidth: 2,
					topColor: colors.topColor,
					bottomColor: colors.bottomColor,
					priceLineVisible: true,
					priceLineColor: colors.priceLineColor
				});

				chart.timeScale().applyOptions({
					barSpacing: 6,
					minBarSpacing: 2,
					maxBarSpacing: 15
				});

				// console.log('Chart initialized successfully');

				const resizeObserver = new ResizeObserver(entries => {
					for (let entry of entries) {
						const { width, height } = entry.contentRect;
						if (width > 10 && height > 10) {
							chart.applyOptions({ width, height });
							chart.timeScale().fitContent();
						}
					}
				});

				resizeObserver.observe(container);

			} catch (error) {
				// console.error('Chart initialization failed:', error);
			}
		};

		window.setBatchHistoryData = function (data) {
			// console.log('Setting batch history data:', data.length, 'points');

			if (!chart || !areaSeries) {
				// console.log('Chart not ready, retrying...');
				setTimeout(() => window.setBatchHistoryData(data), 100);
				return;
			}

			try {
				dataPoints = [];
				dataIndex = 0;
				startTimestamp = null;

				if (data.length > 0) {
					startTimestamp = new Date(data[0].timestamp).getTime();

					dataPoints = data.map((item, index) => {
						return {
							time: index,
							value: item.value,
							originalTime: new Date(item.timestamp).getTime()
						};
					});

					dataIndex = data.length;

					// 根据最后一个点的 trend 更新颜色
					const lastDataPoint = data[data.length - 1];
					const lastTrend = lastDataPoint.value >= 1000000 ? "Up" : "Down";
					// if (lastTrend !== currentTrend) {
						currentTrend = lastTrend;
						const colors = colorSchemes[currentTrend];
						areaSeries.applyOptions({
							lineColor: colors.lineColor,
							topColor: colors.topColor,
							bottomColor: colors.bottomColor,
							priceLineColor: colors.priceLineColor
						});
						// console.log('Trend set to:', currentTrend);
					// }

					areaSeries.setData(dataPoints.map(p => ({ time: p.time, value: p.value })));

					if (dataPoints.length > 0) {
						const lastIndex = dataPoints.length - 1;
						chart.timeScale().setVisibleLogicalRange({
							from: Math.max(0, lastIndex - 50),
							to: lastIndex + 5
						});
					}
					chart.timeScale().fitContent();

					// console.log('Batch history data set successfully');

				} else {
					areaSeries.setData([]);
					chart.timeScale().setVisibleLogicalRange({ from: 0, to: 5 });
					chart.timeScale().fitContent();
				}

			} catch (error) {
				// console.error('Failed to set batch data:', error);
			}
		};

		window.addRealTimeDataPoint = function (value, timestamp, trend) {
			// console.log('Adding real-time point:', value, timestamp, trend);

			if (!chart || !areaSeries) {
				// console.log('Chart not ready, queuing point...');
				setTimeout(() => window.addRealTimeDataPoint(value, timestamp, trend), 100);
				return;
			}

			try {
				// 更新趋势并立即应用颜色
				// if (trend && trend !== currentTrend) {
				currentTrend = trend;
				const colors = colorSchemes[currentTrend];
				areaSeries.applyOptions({
					lineColor: colors.lineColor,
					topColor: colors.topColor,
					bottomColor: colors.bottomColor,
					priceLineColor: colors.priceLineColor
				});
				// // console.log('Trend updated to:', currentTrend);
				// }

				if (!startTimestamp) {
					startTimestamp = new Date(timestamp).getTime();
					// console.log('Start timestamp set:', startTimestamp);
				}

				const newPoint = {
					time: dataIndex,
					value: value,
					originalTime: new Date(timestamp).getTime()
				};

				dataPoints.push(newPoint);
				dataIndex++;

				areaSeries.update(newPoint);

				if (dataPoints.length > 0) {
					const lastIndex = dataPoints.length - 1;
					chart.timeScale().setVisibleLogicalRange({
						from: Math.max(0, lastIndex - 50),
						to: lastIndex + 5
					});
				}
				chart.timeScale().fitContent();

				// console.log('Point added successfully, total points:', dataPoints.length);

			} catch (error) {
				// console.error('Failed to add real-time point:', error);
			}
		};

		window.resetChart = function () {
			// console.log('Resetting chart');

			dataPoints = [];
			dataIndex = 0;
			startTimestamp = null;
			currentTrend = "Up";

			if (!chart) return;

			if (areaSeries) {
				chart.removeSeries(areaSeries);  // 彻底移除旧 series
				areaSeries = null;
			}

			// 重新创建 areaSeries（用当前趋势颜色）
			const colors = colorSchemes[currentTrend];
			areaSeries = chart.addAreaSeries({
				lineColor: colors.lineColor,
				lineWidth: 2,
				topColor: colors.topColor,
				bottomColor: colors.bottomColor,
				priceLineVisible: true,
				priceLineColor: colors.priceLineColor
			});

			areaSeries.setData([]);  // 清空数据

			chart.timeScale().setVisibleLogicalRange({ from: 0, to: 5 });
			chart.timeScale().fitContent();
		};

		window.addEventListener('load', function () {
			// // console.log('Page loaded');

			setTimeout(() => {
				const container = document.getElementById('chart-container');
				if (container && container.clientWidth > 0 && container.clientHeight > 0) {
					window.initChartWithSize(container.clientWidth, container.clientHeight);
				} else {
					window.initChartWithSize(800, 400);
				}
			}, 100);
		});

		window.updateChartStyle = function (isUpTrend) {
			currentTrend = isUpTrend ? "Up" : "Down";
			const colors = colorSchemes[currentTrend];

			if (areaSeries) {
				areaSeries.applyOptions({
					lineColor: colors.lineColor,
					topColor: colors.topColor,
					bottomColor: colors.bottomColor,
					priceLineColor: colors.priceLineColor
				});
			}

			// console.log('Chart style updated to:', currentTrend);
		};
	</script>
</body>

</html>
